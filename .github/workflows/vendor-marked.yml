name: Vendor marked.js

# Downloads the bundled markdown renderer (marked v12.0.2, MIT) and commits it
# to static/marked.min.js. Runs once when this file is added, and can be run
# manually from the Actions tab whenever the version needs to be refreshed.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vendor-marked.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download marked.min.js
        run: |
          mkdir -p static
          curl -sSL -o static/marked.min.js https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js
          echo "15fabce5b65898b32b03f5ed25e9f891a729ad4c0d6d877110a7744aa847a894  static/marked.min.js" | sha256sum -c -

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/marked.min.js
          if git diff --cached --quiet; then
            echo "marked.min.js is already up to date"
          else
            git commit -m "Vendor marked.min.js v12.0.2"
            git push
          fi
