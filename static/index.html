<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Obsidian Local Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M12%202%2020.5%209%2012%2022%203.5%209Z'%20fill='%238875ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg style="display:none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1.2-4.2L15.9 5.1a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.2 18.8z"/><path d="m14 7 3 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7v13h12V7"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M12 3 19.5 9 12 21 4.5 9z"/><path d="M4.5 9h15"/><path d="M12 3 9.5 9l2.5 12 2.5-12z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h5a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4z"/><path d="M20 4h-5a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h5z"/></symbol>
</svg>

<div id="app">
  <div id="ribbon">
    <button id="rb-new" class="ic-btn" data-i18n-title="new_note">
      <svg class="ic"><use href="#i-pen"/></svg>
    </button>
    <button id="rb-search" class="ic-btn" data-i18n-title="search_title">
      <svg class="ic"><use href="#i-search"/></svg>
    </button>
    <button id="rb-refresh" class="ic-btn" data-i18n-title="refresh">
      <svg class="ic"><use href="#i-refresh"/></svg>
    </button>
  </div>

  <aside id="sidebar">
    <div id="brand">
      <svg class="ic brand-ic"><use href="#i-gem"/></svg>
      <span id="vault-name">Vault</span>
    </div>
    <div id="search-wrap">
      <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search_ph">
      <button id="search-close" class="ic-btn" hidden data-i18n-title="search_close">
        <svg class="ic"><use href="#i-x"/></svg>
      </button>
    </div>
    <nav id="tree" data-i18n-aria="files" aria-label="Files"></nav>
    <div id="search-results" hidden></div>
    <div id="sidebar-foot" data-i18n="footer_hint"></div>
  </aside>

  <main id="main">
    <header id="notebar">
      <div id="tab" class="tab">
        <svg class="ic tab-ic"><use href="#i-file"/></svg>
        <span id="tab-name" data-i18n="no_note"></span>
      </div>
      <div id="tab-path"></div>
      <div id="actions">
        <button id="btn-edit" class="ic-btn" disabled data-i18n-title="edit">
          <svg class="ic"><use href="#i-pen"/></svg>
        </button>
        <button id="btn-save" class="primary" hidden>
          <svg class="ic"><use href="#i-check"/></svg>
          <span data-i18n="save"></span>
        </button>
        <button id="btn-cancel" class="ic-btn" hidden data-i18n-title="cancel">
          <svg class="ic"><use href="#i-x"/></svg>
        </button>
        <button id="btn-delete" class="ic-btn" disabled data-i18n-title="delete">
          <svg class="ic"><use href="#i-trash"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" hidden>
      <span data-i18n="changed_banner"></span>
      <button id="btn-reload" class="primary small" data-i18n="reload"></button>
    </div>

    <div id="content">
      <article id="view" hidden></article>
      <textarea id="editor" hidden spellcheck="false" data-i18n-aria="editor" aria-label="Editor"></textarea>
      <section id="welcome">
        <svg class="ic welcome-ic"><use href="#i-book"/></svg>
        <h1 id="welcome-title" data-i18n="welcome_title"></h1>
        <p data-i18n="welcome_p1"></p>
        <p class="hint" data-i18n="welcome_p2"></p>
      </section>
    </div>
  </main>
</div>

<div id="toast" hidden role="status"></div>

<script src="/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
